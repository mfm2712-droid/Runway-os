<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Runway OS · Design Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
@font-face{
  font-family:"Geist";
  src:url("/fonts/Geist-Variable.woff2") format("woff2-variations");
  font-weight:100 900; font-style:normal; font-display:swap;
}
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --ui-bg:#0A0B0D; --ui-panel:#111316; --ui-panel-2:#171A1E; --ui-line:#22262B;
  --ui-t1:#EDEFF2; --ui-t2:#9BA4AF; --ui-t3:#646D78; --ui-acc:#19D9A0;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
}
html,body{height:100%}
body{background:var(--ui-bg);color:var(--ui-t1);font:14px/1.5 'Inter',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden}

.app{display:grid;grid-template-columns:1fr 372px;height:100vh}
@media(max-width:1080px){.app{grid-template-columns:1fr;overflow:auto;height:auto}}

/* ---------- stage ---------- */
.stage{position:relative;display:flex;align-items:center;justify-content:center;overflow:auto;
  background:
    radial-gradient(60% 50% at 50% 0%,rgba(25,217,160,.05),transparent 70%),
    repeating-linear-gradient(0deg,transparent 0 39px,rgba(255,255,255,.018) 39px 40px),
    repeating-linear-gradient(90deg,transparent 0 39px,rgba(255,255,255,.018) 39px 40px),
    var(--ui-bg);
  padding:32px}
.stagebar{position:absolute;top:14px;left:16px;right:16px;display:flex;flex-wrap:wrap;row-gap:8px;align-items:center;gap:10px;z-index:5}
.brand{display:flex;align-items:center;gap:8px;font-weight:600;font-size:13px;letter-spacing:-.01em}
.brandicon{display:inline-flex;width:16px;height:16px}
.brandicon svg,.plogo svg{width:100%;height:100%;display:block;overflow:visible}
.spacer{flex:1}
.seg{display:flex;gap:2px;padding:3px;background:var(--ui-panel);border:1px solid var(--ui-line);border-radius:8px}
.seg button{border:0;background:transparent;color:var(--ui-t3);font:500 11px/1 'Inter',sans-serif;padding:6px 10px;border-radius:6px;cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ui-panel-2);color:var(--ui-t1)}
.seg.scrollx{overflow-x:auto;max-width:min(46vw,440px);scrollbar-width:none}
.seg.scrollx::-webkit-scrollbar{display:none}
.clonebtn{border:1px solid var(--ui-acc);background:rgba(25,217,160,.12);color:var(--ui-acc);
  font:600 11px 'Inter',sans-serif;padding:7px 12px;border-radius:8px;cursor:pointer;white-space:nowrap}
.clonebtn:hover{background:rgba(25,217,160,.2)}
.clonebtn.done{background:var(--ui-acc);color:#05201A}

/* ---------- phone ---------- */
.phonewrap{transform-origin:center center}
.phone{
  width:390px;height:768px;border-radius:44px;padding:10px;
  background:#000;border:1px solid #24282D;box-shadow:0 40px 90px rgba(0,0,0,.7);
  position:relative;flex:0 0 auto}
.screen{
  width:100%;height:100%;border-radius:35px;overflow:hidden;position:relative;
  background:var(--p-bg);
  font-family:-apple-system,BlinkMacSystemFont,'SF Pro Text','Inter',sans-serif;
  color:var(--p-t1);display:flex;flex-direction:column}
.screen::before{content:"";position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(110% 55% at 50% -8%,var(--p-wash),transparent 62%)}
.notch{position:absolute;top:9px;left:50%;transform:translateX(-50%);width:104px;height:24px;border-radius:14px;background:#000;z-index:9}
.statusbar{position:relative;z-index:2;display:flex;align-items:center;justify-content:space-between;padding:14px 24px 2px;font-size:12px;font-weight:600;color:var(--p-t1);letter-spacing:.01em}
.scroll{position:relative;z-index:2;flex:1;overflow-y:auto;scrollbar-width:none;padding:0 var(--p-gutter) calc(var(--p-navH) + 30px);display:flex;flex-direction:column;gap:var(--p-gap)}
.scroll::-webkit-scrollbar{display:none}

.pbar{display:flex;align-items:center;gap:8px;height:46px;flex:0 0 46px}
.plogo{width:22px;height:22px;flex:0 0 22px;display:inline-flex}
@keyframes dlLogoSpin{to{transform:rotate(360deg)}}
.pname{font-size:16px;font-weight:650;letter-spacing:-.015em}
.pname i{font-style:normal;font-size:10px;font-weight:600;color:var(--p-t3);border:1px solid var(--p-border);padding:2px 5px;border-radius:6px;margin-left:5px;vertical-align:2px}
.picon{margin-left:auto;color:var(--p-t2);display:flex;gap:12px}

/* card system driven by tokens */
.card{
  position:relative;background:var(--p-card);
  border-radius:var(--p-radius);
  border:var(--p-bw) solid var(--p-border);
  box-shadow:var(--p-shadow);
  backdrop-filter:blur(var(--p-blur));
  padding:14px 16px;flex:0 0 auto}
.card.hl::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;
  background:linear-gradient(to bottom,rgba(255,255,255,var(--p-hl)),transparent 36%)}
.card.bar{border-left-width:3px;border-left-color:var(--p-accent)}
.card.plain{border-color:transparent}

.hero{padding:18px 16px 16px;text-align:center;overflow:visible}
.eyebrow{font-size:10px;font-weight:700;letter-spacing:.15em;text-transform:uppercase;color:var(--p-accent)}
.ringbox{position:relative;display:grid;place-items:center;margin:var(--p-ringgapT) auto var(--p-ringgapB);
  width:var(--p-ringD);height:var(--p-ringD);
  transform:translateY(calc(var(--p-lift) * -1px))}
.ringglow{position:absolute;border-radius:50%;inset:calc(var(--p-stroke) * .5);
  background:radial-gradient(circle,var(--p-ringglow) 0%,transparent 70%);
  filter:blur(calc(2px + var(--p-bloom) * 6px));opacity:var(--p-bloomA)}
.ringsvg{position:relative;transform:rotate(-90deg)}
.ringc{position:absolute;display:grid;place-content:center;gap:5px;text-align:center;pointer-events:none}
.hv{font-size:var(--p-hero);font-weight:var(--p-heroW);letter-spacing:var(--p-heroLS);line-height:1;
  color:var(--p-t1);font-variant-numeric:tabular-nums;white-space:nowrap}
.hc{font-size:10.5px;color:var(--p-t2);line-height:1.35;max-width:150px;margin:0 auto}
.hpct{font-size:10px;color:var(--p-t3);margin-top:2px}

.row{display:flex;align-items:center;gap:12px;padding:11px 14px}
.rowic{flex:0 0 34px;width:34px;height:34px;border-radius:calc(var(--p-radius) * .4);display:grid;place-items:center;
  border:1px solid var(--p-border);background:var(--p-surf);color:var(--p-accent)}
.rowb{flex:1;min-width:0}
.rowt,.rowm,.rowv,.rows2{display:block}
.rowt{font-size:14.5px;font-weight:560;letter-spacing:-.005em;line-height:1.2}
.rowm{font-size:11px;color:var(--p-t3);margin-top:2px;line-height:1.2}
.rowr{text-align:right;flex:0 0 auto}
.rowv{font-size:14.5px;font-weight:600;font-variant-numeric:tabular-nums;line-height:1.2}
.rows2{font-size:10.5px;color:var(--p-t3);margin-top:2px;line-height:1.2}
.chev{color:var(--p-t3);opacity:.6}

.calc .ct{font-size:10px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--p-accent)}
.crow{display:flex;align-items:stretch;gap:3px;margin-top:10px}
.cc{flex:1;border-radius:calc(var(--p-radius) * .42);border:1px solid var(--p-border);background:var(--p-surf);padding:7px 2px 8px;text-align:center}
.cck{font-size:7.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--p-t3);line-height:1.25}
.ccv{font-size:11px;font-weight:600;margin-top:3px;font-variant-numeric:tabular-nums}
.cop{flex:0 0 10px;display:grid;place-items:center;font-size:11px;color:var(--p-t3);opacity:.7}
.cc.res{border-color:var(--p-accent);background:var(--p-accsoft)}
.cc.res .ccv{color:var(--p-accent);font-size:12px;font-weight:700}
.cnote{font-size:10px;color:var(--p-t3);line-height:1.5;margin-top:9px}

.nav{position:absolute;z-index:6;left:0;right:0;bottom:0;display:flex;justify-content:center;pointer-events:none}
.navin{display:grid;align-items:center;height:var(--p-navH);pointer-events:auto}
.nav.pill .navin{width:calc(100% - 32px);margin-bottom:14px;border-radius:var(--p-radius);
  border:var(--p-bw) solid var(--p-border);background:var(--p-navbg);backdrop-filter:blur(18px);
  box-shadow:0 -6px 24px rgba(0,0,0,.5)}
.nav.flat .navin{width:100%;padding-bottom:8px;height:calc(var(--p-navH) + 8px);
  border-top:var(--p-bw) solid var(--p-border);background:var(--p-navbg);backdrop-filter:blur(18px)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--p-t3);font-size:8.5px;font-weight:600;letter-spacing:.03em}
.tab.on{color:var(--p-accent)}
.tab.on svg{filter:drop-shadow(0 0 6px var(--p-accent))}
.fab{justify-self:center;width:44px;height:44px;border-radius:50%;display:grid;place-items:center;
  background:var(--p-accent);color:#04140F;box-shadow:0 0 16px var(--p-ringglow)}

/* ---------- multi-screen extras ---------- */
.stepdots{display:flex;gap:6px;justify-content:center;margin-bottom:18px}
.stepdots span{width:6px;height:6px;border-radius:50%;background:var(--p-border)}
.stepdots span.on{background:var(--p-accent);width:16px;border-radius:3px}
.orb{width:118px;height:118px;margin:6px auto 18px}
.orb svg{width:100%;height:100%;overflow:visible}
.ob-title{font-size:20px;font-weight:650;text-align:center;letter-spacing:-.01em;line-height:1.25;margin-bottom:8px}
.ob-sub{font-size:12.5px;color:var(--p-t2);text-align:center;line-height:1.5;max-width:260px;margin:0 auto}
.cta{display:flex;align-items:center;justify-content:center;gap:6px;padding:14px;border-radius:var(--p-radius);
  background:var(--p-accent);color:#04140F;font-size:14px;font-weight:650;text-align:center}
.presetrow{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none}
.presetrow::-webkit-scrollbar{display:none}
.pchip{flex:0 0 auto;padding:7px 12px;border-radius:20px;border:1px solid var(--p-border);background:var(--p-surf);
  font-size:11px;color:var(--p-t2);white-space:nowrap}
.pchip.on{background:var(--p-accsoft);border-color:var(--p-accent);color:var(--p-accent);font-weight:600}
.listrow{display:flex;align-items:center;gap:12px;padding:11px 2px}
.datelabel{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--p-t3);
  padding:2px 2px 6px}
.toggle{width:38px;height:22px;border-radius:12px;background:var(--p-surf);border:1px solid var(--p-border);
  position:relative;flex:0 0 auto}
.toggle.on{background:var(--p-accent)}
.toggle i{position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;
  font-style:normal;transition:left .15s ease}
.toggle.on i{left:18px;background:#04140F}

/* ---------- stat pills + CTA + canvas (Surface panel) ---------- */
.statpillrow{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.statpillrow::-webkit-scrollbar{display:none}
.statpill{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:8px 13px;font-size:11.5px;font-weight:600;
  color:var(--p-t1);white-space:nowrap;
  border-radius:var(--pill-radius,999px);
  border:var(--pill-bw,1px) solid var(--pill-border,var(--p-border));
  background:var(--pill-bg,var(--p-surf));
  background-image:var(--pill-bgimg,none);
  backdrop-filter:blur(var(--pill-blur,0px))}
.hv.grad{background-image:var(--hero-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.stage.bg-grid{background:
    radial-gradient(60% 50% at 50% 0%,rgba(25,217,160,.05),transparent 70%),
    repeating-linear-gradient(0deg,transparent 0 39px,rgba(255,255,255,.018) 39px 40px),
    repeating-linear-gradient(90deg,transparent 0 39px,rgba(255,255,255,.018) 39px 40px),
    var(--ui-bg)}
.stage.bg-spotlight{background:
    radial-gradient(55% 55% at 50% 22%,rgba(25,217,160,.14),transparent 68%),
    var(--ui-bg)}
.stage.bg-obsidian{background:var(--ui-bg)}

/* ---------- panel ---------- */
.panel{background:var(--ui-panel);border-left:1px solid var(--ui-line);display:flex;flex-direction:column;min-height:0}
.ptabs{display:flex;border-bottom:1px solid var(--ui-line);flex:0 0 auto}
.ptabs button{flex:1;border:0;background:transparent;color:var(--ui-t3);font:600 11.5px/1 'Inter',sans-serif;padding:14px 0;cursor:pointer;border-bottom:2px solid transparent}
.ptabs button[aria-selected="true"]{color:var(--ui-t1);border-bottom-color:var(--ui-acc)}
.pbody{flex:1;overflow-y:auto;padding:4px 0 40px;min-height:0}
.pbody::-webkit-scrollbar{width:8px}
.pbody::-webkit-scrollbar-thumb{background:#252A30;border-radius:4px}

.grp{border-bottom:1px solid var(--ui-line);padding:14px 16px}
.grph{font:700 9.5px/1 'Inter',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--ui-t3);margin-bottom:12px}
.ctl{margin-bottom:11px}
.ctl:last-child{margin-bottom:0}
.lab{display:flex;align-items:center;justify-content:space-between;font-size:11.5px;color:var(--ui-t2);margin-bottom:6px}
.lab b{font:500 11px/1 var(--mono);color:var(--ui-t1)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:3px;border-radius:2px;background:#2A2F36;outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:13px;height:13px;border-radius:50%;background:var(--ui-t1);border:2px solid var(--ui-panel);box-shadow:0 0 0 1px #3A4048;cursor:pointer}
input[type=range]::-moz-range-thumb{width:13px;height:13px;border-radius:50%;background:var(--ui-t1);border:2px solid var(--ui-panel);cursor:pointer}
input[type=color]{-webkit-appearance:none;appearance:none;width:100%;height:26px;border:1px solid var(--ui-line);border-radius:6px;background:none;cursor:pointer;padding:2px}
input[type=color]::-webkit-color-swatch-wrapper{padding:0}
input[type=color]::-webkit-color-swatch{border:0;border-radius:4px}
select{width:100%;background:var(--ui-panel-2);color:var(--ui-t1);border:1px solid var(--ui-line);border-radius:6px;padding:7px 9px;font:500 11.5px 'Inter',sans-serif;cursor:pointer}
.sw{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.sw>div{text-align:center}
.sw label{display:block;font-size:9px;color:var(--ui-t3);margin-top:4px}
.chk{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ui-t2);cursor:pointer;padding:3px 0}
.chk input{accent-color:var(--ui-acc);width:14px;height:14px;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chips button{border:1px solid var(--ui-line);background:var(--ui-panel-2);color:var(--ui-t2);font:500 10.5px 'Inter',sans-serif;padding:6px 9px;border-radius:6px;cursor:pointer}
.chips button:hover{color:var(--ui-t1);border-color:#333A42}

.out{width:100%;height:300px;background:#0B0D0F;border:1px solid var(--ui-line);border-radius:8px;
  color:#B6C2CC;font:400 10.5px/1.6 var(--mono);padding:11px;resize:vertical;white-space:pre;overflow:auto}
.btn{display:flex;align-items:center;justify-content:center;gap:7px;width:100%;padding:10px;border-radius:8px;
  border:1px solid var(--ui-line);background:var(--ui-panel-2);color:var(--ui-t1);font:600 12px 'Inter',sans-serif;cursor:pointer;margin-top:9px}
.btn.pri{background:var(--ui-acc);border-color:var(--ui-acc);color:#05201A}
.btn:hover{border-color:#3A4148}
.hint{font-size:10.5px;color:var(--ui-t3);line-height:1.55;margin-top:9px}
.warn{font-size:10.5px;color:#FFC24D;line-height:1.55;margin-top:9px}
.thr{position:relative;height:20px;border-radius:5px;overflow:hidden;border:1px solid var(--ui-line);margin:10px 0 14px}
.sw{margin-bottom:2px}
</style>
</head>
<body>
<div class="app">

  <section class="stage">
    <div class="stagebar">
      <span class="brand">
        <span class="brandicon" id="brandlogo"></span>
        Design Lab
      </span>
      <div class="seg scrollx" id="screenseg">
        <button data-s="overview" aria-pressed="true">Overview</button>
        <button data-s="onboarding">Onboarding</button>
        <button data-s="simulate">Simulate</button>
        <button data-s="subs">Subs</button>
        <button data-s="history">History</button>
        <button data-s="settings">Settings</button>
      </div>
      <span class="spacer"></span>
      <div class="seg" id="langseg">
        <button data-lang="es" aria-pressed="true">ES</button><button data-lang="en">EN</button>
      </div>
      <button class="clonebtn" id="clonebtn" title="Guarda estos tokens en localStorage para que /app los cargue al vuelo. Solo funciona si abres esto en el mismo servidor (http://localhost:xxxx/design-lab.html), no como archivo local.">⇪ Clonar a la app</button>
      <div class="seg" id="zoomseg">
        <button data-z="0.72">72%</button><button data-z="0.86" aria-pressed="true">86%</button><button data-z="1">100%</button>
      </div>
    </div>

    <div class="phonewrap" id="phonewrap">
      <div class="phone">
        <div class="notch"></div>
        <div class="screen" id="screen">
          <div class="statusbar"><span>9:41</span><span>▪▪▪ ᯤ ▰</span></div>
          <div class="scroll" id="scroll"></div>

          <div class="nav pill" id="nav">
            <div class="navin" id="navin"></div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <aside class="panel">
    <div class="ptabs" role="tablist">
      <button role="tab" aria-selected="true" data-t="ring">Anillo</button>
      <button role="tab" data-t="logo">Logo</button>
      <button role="tab" data-t="color">Color</button>
      <button role="tab" data-t="card">Tarjetas</button>
      <button role="tab" data-t="surface">Superficie</button>
      <button role="tab" data-t="type">Tipo</button>
      <button role="tab" data-t="exp">Export</button>
    </div>
    <div class="pbody" id="pbody"></div>
  </aside>
</div>

<script>
/* =======================================================================
   STATE
   ======================================================================= */
const S = {
  pct: 0.72,
  ringD: 236, stroke: 24, cap: 'round', trackA: 0.09,
  bloom: 0.55, bloomA: 0.5, lift: 8, gapT: 14, gapB: 10,
  colorMode: 'gradual',
  gradA:'#8DFFFF', gradB:'#19D9A0', gradC:'#2E9FD8',
  cHealthy:'#19D9A0', cCaution:'#FFC24D', cDanger:'#FF5C72', cNeg:'#C8323F',
  tHigh: 0.5, tLow: 0.2,
  accentFollows: true, accent:'#19D9A0',
  bg:'#04070A', card:'#0A1218', surf:'#0E181F',
  borderCol:'#19D9A0', borderA:0.14, bw:1, borderStyle:'realce',
  radius:22, shadow:0.5, blur:8, highlight:0.05, wash:0.08,
  gap:9, gutter:16,
  hero:38, heroW:650, heroLS:-0.02,
  heroFont:'inter', heroColorMode:'solid', heroColor:'#F8FAFC',
  heroGradA:'#8DFFFF', heroGradB:'#19D9A0',
  navStyle:'pill', navH:62, fab:true, tabs:5,
  currency:'$',
  logoSpeed:6, logoPaused:false, logoDir:'cw',
  logoGradA:'#8DFFFF', logoGradB:'#19D9A0',
  logoGlowBlur:6, logoGlowOpacity:0.55,
  logoThickness:2.6, logoDiameter:16.8,
  pillBg:'glass', pillBlur:12, pillGradA:'#00B6B4', pillGradB:'#19D9A0',
  pillMeshColor:'#19D9A0', pillMeshA:0.18,
  pillBorderCol:'#19D9A0', pillBorderA:0.16, pillBw:1, pillRadiusMode:'full',
  ctaGradient:'cyanEmerald', ctaGlow:14, ctaLift:1.03,
  canvasBg:'grid'
};

let currentScreen = 'overview';
let LANG = 'es';

/* =======================================================================
   TRANSLATIONS — editor chrome + preview screen copy.
   The Export payload (buildExport) is NEVER driven by this — it is always
   written in English regardless of LANG, since it's meant to be pasted
   into code/instructions for Claude.
   ======================================================================= */
const T = {
es: {
  'tab.ring':'Anillo','tab.logo':'Logo','tab.color':'Color','tab.card':'Tarjetas','tab.surface':'Superficie','tab.type':'Tipo','tab.exp':'Export',
  'clone.btn':'⇪ Clonar a la app','clone.done':'✓ Guardado — abre /app','clone.fail':'No se pudo guardar (¿localStorage bloqueado?)',
  'clone.tooltip':'Guarda estos tokens en localStorage para que /app los cargue al vuelo. Solo funciona si abres esto en el mismo servidor (http://localhost:xxxx/design-lab.html), no como archivo local.',
  'ring.simTitle':'Simulador de estado','ring.pct':'Gasto seguro sin gastar',

function t(k){ const v=T[LANG]&&T[LANG][k]; return v!==undefined?v:k; }
function tf(k,vars){ let s=t(k); if(vars) for(const key in vars) s=s.replace('{'+key+'}', vars[key]); return s; }

/* =======================================================================
   HELPERS
   ======================================================================= */
const $ = s => document.querySelector(s);
const screen = $('#screen');

function hex2rgb(h){h=h.replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');
  return [parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function rgba(h,a){const[r,g,b]=hex2rgb(h);return `rgba(${r}, ${g}, ${b}, ${a})`;}
function rgb2hsl(r,g,b){r/=255;g/=255;b/=255;const mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;
  let h=0;if(d){if(mx===r)h=((g-b)/d)%6;else if(mx===g)h=(b-r)/d+2;else h=(r-g)/d+4;h*=60;if(h<0)h+=360;}
  const l=(mx+mn)/2, s=d?d/(1-Math.abs(2*l-1)):0;return [h,s,l];}
function hsl2hex(h,s,l){const c=(1-Math.abs(2*l-1))*s,hp=((h%360)+360)%360/60,x=c*(1-Math.abs(hp%2-1));
  let r=0,g=0,b=0;
  if(hp<1){r=c;g=x}else if(hp<2){r=x;g=c}else if(hp<3){g=c;b=x}else if(hp<4){g=x;b=c}else if(hp<5){r=x;b=c}else{r=c;b=x}
  const m=l-c/2;
  return '#'+[r,g,b].map(v=>Math.round((v+m)*255).toString(16).padStart(2,'0')).join('').toUpperCase();}
/* interpolate through HSL so amber -> green passes through lime, not olive mud */
function mix(h1,h2,t){
  t=Math.max(0,Math.min(1,t));
  const A=rgb2hsl(...hex2rgb(h1)), B=rgb2hsl(...hex2rgb(h2));
  let dh=B[0]-A[0]; if(dh>180)dh-=360; if(dh<-180)dh+=360;
  return hsl2hex(A[0]+dh*t, A[1]+(B[1]-A[1])*t, A[2]+(B[2]-A[2])*t);}

/* colour the ring gets at the current pct */
function ringColor(){
  const p = S.pct;
  if(p <= 0) return {a:S.cNeg, b:S.cNeg, single:true};
  if(S.colorMode === 'fijo')    return {a:S.gradA, b:S.gradB, c:S.gradC, single:false};
  if(S.colorMode === 'umbral'){
    const c = p >= S.tHigh ? S.cHealthy : (p >= S.tLow ? S.cCaution : S.cDanger);
    return {a:c, b:c, single:true};
  }
  /* gradual — interpolate danger -> caution -> healthy */
  let c;
  if(p <= S.tLow)      c = mix(S.cDanger, S.cCaution, S.tLow ? p/S.tLow : 1);
  else if(p <= S.tHigh) c = mix(S.cCaution, S.cHealthy, (p-S.tLow)/Math.max(.001,S.tHigh-S.tLow));
  else                  c = S.cHealthy;
  return {a:c, b:c, single:true};
}

/* =======================================================================
   LOGO — animated gradient ring, drives stagebar brand mark + in-phone pbar
   ======================================================================= */
function logoSVG(){
  const gid = 'lg' + Math.random().toString(36).slice(2, 9);
  const r = Math.max(1, (S.logoDiameter - S.logoThickness) / 2).toFixed(2);
  const dur = S.logoPaused ? '999999s' : S.logoSpeed + 's';
  const dir = S.logoDir === 'ccw' ? 'reverse' : 'normal';
  const glow = rgba(S.logoGradA, S.logoGlowOpacity);
  const style = `animation:dlLogoSpin ${dur} linear infinite;animation-direction:${dir};`
    + `transform-box:fill-box;transform-origin:50% 50%;`
    + `filter:drop-shadow(0 0 ${S.logoGlowBlur}px ${glow})`;
  return `<svg viewBox="0 0 22 22" style="${style}" aria-hidden="true">
    <defs><linearGradient id="${gid}" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="${S.logoGradA}"/><stop offset="100%" stop-color="${S.logoGradB}"/>
    </linearGradient></defs>
    <circle cx="11" cy="11" r="${r}" fill="none" stroke="url(#${gid})" stroke-width="${S.logoThickness}"/>
    <circle cx="11" cy="11" r="3.2" fill="url(#${gid})" opacity=".3"/>
  </svg>`;
}
function renderLogo(){
  const brand = $('#brandlogo'); if(brand) brand.innerHTML = logoSVG();

   ======================================================================= */
function drawRing(){
  const D = S.ringD, r = (D - S.stroke)/2, C = 2*Math.PI*r;
  const off = C * (1 - Math.max(0, Math.min(1, S.pct)));
  const col = ringColor();
  const svg = $('#ringsvg');
  if(svg){
    const stops = col.single
      ? `<stop offset="0%" stop-color="${col.a}"/><stop offset="100%" stop-color="${col.b}"/>`
      : `<stop offset="0%" stop-color="${col.a}"/><stop offset="45%" stop-color="${col.b}"/><stop offset="100%" stop-color="${col.c}"/>`;
    const arc = S.pct > 0 ? `<circle cx="${D/2}" cy="${D/2}" r="${r}" fill="none" stroke="url(#g)"
        stroke-width="${S.stroke}" stroke-linecap="${S.cap}"
        stroke-dasharray="${C.toFixed(1)}" stroke-dashoffset="${off.toFixed(1)}"
        style="filter:drop-shadow(0 0 ${(4+S.bloom*12).toFixed(0)}px ${rgba(col.a, S.bloomA)})"/>` : '';
    svg.setAttribute('width', D); svg.setAttribute('height', D);
    svg.setAttribute('viewBox', `0 0 ${D} ${D}`);
    svg.innerHTML = `<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">${stops}</linearGradient></defs>
      <circle cx="${D/2}" cy="${D/2}" r="${r}" fill="none" stroke="${rgba(col.a, S.trackA)}" stroke-width="${S.stroke}"/>${arc}`;
  }
  return col;
}

  const pillVars = {
    '--pill-border': rgba(S.pillBorderCol, S.pillBorderA),
    '--pill-bw': S.pillBw+'px',
    '--pill-radius': S.pillRadiusMode==='full' ? '999px' : (S.pillRadiusMode==='2xl' ? '20px' : '10px'),
    '--pill-blur': (S.pillBg==='glass' ? S.pillBlur : 0)+'px'
  };
  if(S.pillBg==='solid'){ pillVars['--pill-bg']=S.surf; pillVars['--pill-bgimg']='none'; }
  else if(S.pillBg==='glass'){ pillVars['--pill-bg']='rgba(255,255,255,0.06)'; pillVars['--pill-bgimg']='none'; }
  else if(S.pillBg==='gradient'){ pillVars['--pill-bg']=S.surf; pillVars['--pill-bgimg']=`linear-gradient(120deg, ${rgba(S.pillGradA,0.35)}, ${rgba(S.pillGradB,0.35)})`; }
  else { pillVars['--pill-bg']=S.surf; pillVars['--pill-bgimg']=`radial-gradient(circle at 30% 20%, ${rgba(S.pillMeshColor,S.pillMeshA)}, transparent 65%)`; }
  for(const k in pillVars) screen.style.setProperty(k, pillVars[k]);

  const ctaPresets = {
    cyanEmerald:{bg:`linear-gradient(120deg, ${S.cHealthy}, #00B6B4)`, fg:'#04140F', border:'transparent'},
    neonBlue:{bg:'linear-gradient(120deg, #38BDF8, #6366F1)', fg:'#04101F', border:'transparent'},
    solidTeal:{bg:'#00B6B4', fg:'#04140F', border:'transparent'},
    outlinedGlass:{bg:'rgba(255,255,255,0.04)', fg:acc, border:acc}
  };
  const ctaP = ctaPresets[S.ctaGradient] || ctaPresets.cyanEmerald;
  const ctaEl = $('.cta');
  if(ctaEl){
    ctaEl.style.background = ctaP.bg;
    ctaEl.style.color = ctaP.fg;
    ctaEl.style.border = ctaP.border==='transparent' ? 'none' : `1.5px solid ${ctaP.border}`;
    ctaEl.style.boxShadow = `0 0 ${S.ctaGlow}px ${rgba(S.ctaGradient==='outlinedGlass'?acc:S.cHealthy, 0.5)}`;
    ctaEl.style.setProperty('--cta-lift', S.ctaLift);
    ctaEl.onmouseenter = () => ctaEl.style.transform = `scale(${S.ctaLift})`;
    ctaEl.onmouseleave = () => ctaEl.style.transform = 'scale(1)';
  }

  const stage = document.querySelector('.stage');
  if(stage) stage.className = 'stage bg-' + S.canvasBg;

  renderLogo();
  drawNav();
  if(activeTab==='exp') buildExport();
}

const FMT = {};
function slider(key,label,min,max,step,fmt){
  if(fmt) FMT[key]=fmt;
  return `<div class="ctl"><div class="lab"><span>${label}</span><b data-out="${key}">${fmt?fmt(S[key]):S[key]}</b></div>
    <input type="range" data-k="${key}" min="${min}" max="${max}" step="${step}" value="${S[key]}"></div>`;
}
function color(key,label){return `<div><input type="color" data-k="${key}" value="${S[key]}"><label>${label}</label></div>`;}
function sel(key,label,opts){
  return `<div class="ctl"><div class="lab"><span>${label}</span></div><select data-k="${key}">
    ${opts.map(o=>`<option value="${o[0]}"${S[key]===o[0]?' selected':''}>${o[1]}</option>`).join('')}</select></div>`;
}
function chk(key,label){return `<label class="chk"><input type="checkbox" data-k="${key}"${S[key]?' checked':''}><span>${label}</span></label>`;}

let activeTab = 'ring';
function paint(){
  $('#pbody').innerHTML = TABS[activeTab]();
  if(activeTab==='color'){ updModeHint(); updThrBar(); }
  if(activeTab==='exp'){ buildExport(); $('#cfgbox').value = JSON.stringify(S); }
}
function updModeHint(){
  const h = $('#modehint'); if(!h) return;
  h.textContent = t('color.hint.'+S.colorMode);
}
function applyChrome(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('.ptabs button[data-t]').forEach(b=>{
    b.textContent = t('tab.'+b.dataset.t);
  });
  const cb = $('#clonebtn');
  if(cb){ cb.textContent = t('clone.btn'); cb.title = t('clone.tooltip'); }
  document.querySelectorAll('#langseg button').forEach(b=>{
    b.setAttribute('aria-pressed', b.dataset.lang===LANG ? 'true' : 'false');
  });
}
function updThrBar(){
  const b = $('#thrbar'); if(!b) return;
  b.style.background = `linear-gradient(90deg, ${S.cDanger} 0%, ${S.cDanger} ${S.tLow*100}%, ${S.cCaution} ${S.tLow*100}%, ${S.cCaution} ${S.tHigh*100}%, ${S.cHealthy} ${S.tHigh*100}%)`;
  if(S.colorMode==='gradual') b.style.background = `linear-gradient(90deg, ${S.cDanger} 0%, ${S.cCaution} ${S.tLow*100}%, ${S.cHealthy} ${S.tHigh*100}%, ${S.cHealthy} 100%)`;
}

document.querySelectorAll('.ptabs button').forEach(b=>b.addEventListener('click',()=>{
  document.querySelectorAll('.ptabs button').forEach(x=>x.setAttribute('aria-selected','false'));
  b.setAttribute('aria-selected','true'); activeTab=b.dataset.t; paint();
}));

$('#pbody').addEventListener('input', e=>{
  const k = e.target.dataset.k; if(!k) return;
  if(e.target.type==='checkbox') S[k]=e.target.checked;
  else if(e.target.type==='range') S[k]=parseFloat(e.target.value);
  else S[k]=e.target.value;
  const out = document.querySelector(`[data-out="${k}"]`);
  if(out && e.target.type==='range'){
    out.textContent = FMT[k] ? FMT[k](S[k]) : S[k];
  }
  if(activeTab==='color'){ updModeHint(); updThrBar(); }
  render();
  if(e.target.tagName==='SELECT' && (k==='colorMode'||k==='borderStyle'||k==='navStyle'||k==='cap')) { /* no repaint needed */ }
});
const BSTYLE = {
  hairline:{bw:1,borderA:0.12,highlight:0},
  realce:{bw:1,borderA:0.14,highlight:0.05},
  barra:{bw:1,borderA:0.12,highlight:0},
  solido:{bw:1,borderA:0.40,highlight:0},
  sin:{bw:0,borderA:0,highlight:0}
};
const REPAINT_ON_CHANGE = ['borderStyle','heroColorMode','pillBg'];
$('#pbody').addEventListener('change', e=>{
  const k=e.target.dataset.k;
  if(k && e.target.tagName==='SELECT'){
    if(k==='borderStyle'){ Object.assign(S, BSTYLE[S.borderStyle]); }
    if(REPAINT_ON_CHANGE.includes(k)) paint();
    if(activeTab==='color'){updModeHint();updThrBar();}
    render();
  }
});
$('#pbody').addEventListener('click', e=>{
  const st = e.target.dataset.set;
  if(st){ const [k,v]=st.split(':'); S[k]=parseFloat(v); paint(); render(); return; }
  const pr = e.target.dataset.preset;
  if(pr){ Object.assign(S, PRESETS[pr]); paint(); render(); return; }
  const lp = e.target.dataset.lp;
  if(lp){ const [a,b] = lp.split(','); S.logoGradA = '#'+a; S.logoGradB = '#'+b; paint(); render(); return; }
  if(e.target.id==='clonebtn2'){ cloneToApp(e.target); return; }
  if(e.target.id==='copybtn'){
    const box=$('#outbox'); box.select(); box.setSelectionRange(0, box.value.length);
    const flash = (msg)=>{e.target.textContent=msg;setTimeout(()=>e.target.textContent=t('exp.copyBtn'),1600);};
    if(navigator.clipboard && window.isSecureContext){
      navigator.clipboard.writeText(box.value).then(
        ()=>flash(t('exp.copyDone')),
        ()=>legacyCopy());
    } else legacyCopy();
    function legacyCopy(){
      /* navigator.clipboard needs a secure context (https/localhost) — under
         file:// it's simply undefined, so this execCommand fallback is what
         actually makes the button do something when opened as a plain file. */
      try{
        const ok = document.execCommand('copy');

  At pct = 0 use danger. At pct = ${S.tLow} use caution. At pct = ${S.tHigh} and above use healthy.
  Interpolate between those anchors. No hard steps. Animate the colour change over ~400ms.`,
    umbral:`Step, no interpolation. pct >= ${S.tHigh} -> healthy. ${S.tLow} <= pct < ${S.tHigh} -> caution. 0 < pct < ${S.tLow} -> danger.`,
    fijo:`Fixed 3-stop gradient regardless of pct: ${S.gradA} at top, ${S.gradB} to the right, ${S.gradC} to the left.`

    hairline:'1px hairline border at low opacity. No inner highlight.',
    realce:`Hairline border plus a top inner highlight: linear-gradient(to bottom, rgba(255,255,255,${S.highlight}), transparent 36%). This is what makes cards read as glass rather than flat grey.`,
    barra:'Hairline border on all sides, plus a 3px left border in the accent colour.',
    solido:'Visible solid border, higher opacity, no inner highlight.',
    sin:'No border at all. The card surface colour alone carries the shape.'

  box.value =
`RUNWAY OS — VISUAL TOKENS FROM DESIGN LAB
Apply these exact values to the existing components.
Change only what is listed here. Delete nothing. No new dependencies.
Keep TypeScript, the existing i18n and the existing currency formatter.

RING GEOMETRY
  outer diameter        ${S.ringD}px   (express as ${(S.ringD/390*100).toFixed(0)}% of viewport width so it scales)
  stroke width          ${S.stroke}px
  inner content circle  ${S.ringD - S.stroke*2}px
  line cap              ${S.cap}
  track                 same geometry, accent at ${S.trackA} opacity
  lift                  translateY(-${S.lift}px)
  outer bloom           drop-shadow(0 0 ${(4+S.bloom*12).toFixed(0)}px accent @ ${S.bloomA.toFixed(2)} alpha)
  space above ring      ${S.gapT}px
  space below ring      ${S.gapB}px

RING COLOUR — MODE: ${S.colorMode.toUpperCase()}
  ${modeTxt}

  healthy   ${S.cHealthy}
  caution   ${S.cCaution}
  danger    ${S.cDanger}
  negative  ${S.cNeg}     (pct <= 0, i.e. overspent)

  Thresholds: high ${S.tHigh}, low ${S.tLow}
  When pct <= 0: draw no arc, track only, and set the hero figure to ${S.cNeg}.

SURFACES
  --bg           ${S.bg}
  --card         ${S.card}
  --surface      ${S.surf}
  --accent       ${acc}${S.accentFollows ? '   (accent follows the ring colour — recompute it from pct)' : ''}
  --accent-soft  rgba on accent at 0.10
  --border       ${rgba(S.borderCol, S.borderA)}
  background wash: radial-gradient(110% 55% at 50% -8%, accent @ ${S.wash}, transparent 62%)

CARDS
  border style   ${bs}
  border width   ${S.bw}px
  radius         ${S.radius}px
  shadow         0 ${(S.shadow*22).toFixed(0)}px ${(S.shadow*54).toFixed(0)}px rgba(0,0,0,${S.shadow.toFixed(2)})
  backdrop blur  ${S.blur}px
  gap between    ${S.gap}px
  page gutter    ${S.gutter}px

HERO FIGURE
  font-family    ${HERO_FONT_EXPORT[S.heroFont]}
  font-size      ${S.hero}px
  font-weight    ${S.heroW}
  letter-spacing ${S.heroLS}em
  color          ${S.heroColorMode==='gradient' ? `gradient text, linear-gradient(90deg, ${S.heroGradA}, ${S.heroGradB}), background-clip:text` : S.heroColor}
  tabular-nums   on
  eyebrow label  10px, uppercase, tracking 0.15em, accent colour

PILLS / STAT CARDS
  background     ${PILL_BG_EXPORT[S.pillBg]}
  border         ${S.pillBw}px solid ${rgba(S.pillBorderCol, S.pillBorderA)}
  radius         ${S.pillRadiusMode==='full' ? '999px (fully rounded)' : S.pillRadiusMode==='2xl' ? '20px (rounded-2xl)' : '10px (rounded-lg)'}

CTA BUTTONS
  gradient preset   ${S.ctaGradient}  (${CTA_EXPORT[S.ctaGradient]})
  glow spread       0 0 ${S.ctaGlow}px accent @ 0.5 alpha
  hover lift        scale(${S.ctaLift})

DESIGN LAB CANVAS BACKGROUND (editor only, not the app)
  ${S.canvasBg==='grid' ? 'faint 40px grid + soft radial glow at top' : S.canvasBg==='spotlight' ? 'stronger radial spotlight glow, no grid' : 'flat obsidian black, no pattern'}

NAVIGATION
  shape          ${S.navStyle === 'pill' ? 'floating pill, 16px inset from both edges, 14px above the bottom' : 'flat bar pinned to the bottom edge'}
  height         ${S.navH}px

  active tab     accent colour plus a soft glow on the icon only

GLOW BUDGET
  Glow is permitted on exactly these: the ring arc, the active nav tab, the

  Strip glow and cyan-tinted borders from everything else.

DO NOT
  - do not change any copy or label wording

tell me rather than following it.`;

<script data-pplx-inline-edit>
(function () {
  if (window === window.top) return;

  const allowedParentOrigins = ["https://www.perplexity.ai","https://perplexity.ai","https://testing.perplexity.ai","https://staging.perplexity.ai","https://*.preview.i.perplexity.ai","http://perplexity.localhost","http://localhost:1420","http://127.0.0.1:1420","http://localhost:3000","http://127.0.0.1:3000","http://localhost:5173","http://127.0.0.1:5173"];
  const MAX_FONT_BYTES = 500 * 1024;
  const MAX_TOTAL_FONT_BYTES = 2 * 1024 * 1024;
  let scrollForwarding = false;
  let scrollRaf = 0;
  let trustedTopOrigin = null;

  // Allow entries like "https://*.preview.i.perplexity.ai" — the wildcard
  // matches a single DNS label (no dots), so "https://*.foo" cannot stretch
  // across multiple labels.
  function matchesAllowedOrigin(origin) {
    if (!origin) return false;
    for (const entry of allowedParentOrigins) {
      if (!entry.includes("*")) {
        if (entry === origin) return true;
        continue;
      }
      const pattern = new RegExp(
        "^" +
          entry.replace(/[.+?^${}()|[\]\\]/g, "\\$&").replace(/\*/g, "[^.]+") +
          "$",
      );
      if (pattern.test(origin)) return true;
    }
    return false;
  }

  // Trust decision: when the sender is same-origin-visible (event.origin is a
  // real origin like https://www.perplexity.ai) we trust event.origin directly.
  // When event.origin is "null" (opaque broker srcdoc), we fall back to the
  // broker's stamped `parentOrigin` to identify the top window. The fallback
  // is claim-only — we rely on the browser's native `targetOrigin` enforcement
  // on the response path (see postToTrustedTop) to ensure replies can't be
  // delivered to anyone but the actual top window of that claimed origin.
  function getTrustedParentOrigin(event) {
    const forwardedParentOrigin =
      typeof event.data.parentOrigin === "string" ? event.data.parentOrigin : null;
    const parentOrigin = event.origin === "null" ? forwardedParentOrigin : event.origin;
    return matchesAllowedOrigin(parentOrigin) ? parentOrigin : null;
  }

  // All responses go to window.top with targetOrigin = the allowlisted origin.
  // An attacker that iframes us inside their own null-origin broker can claim
  // any parentOrigin they like, but the browser will drop the reply whenever
  // the real top's origin doesn't match — so the screenshot never leaves.
  function postToTrustedTop(message) {
    if (!trustedTopOrigin) return;
    try {
      window.top.postMessage(message, trustedTopOrigin);
    } catch (_error) {}
  }

  function inlineAll(original, clone) {
    if (original.nodeType !== 1 || clone.nodeType !== 1) return;

    try {
      const computedStyle = getComputedStyle(original);
      // cssText on a computed style is the serialized declaration in modern
      // Chromium/Safari — a single read beats enumerating ~400 longhand
      // properties. Firefox returns "" here, so we fall back on empty.
      const serialized = computedStyle.cssText;
      if (serialized) {
        clone.style.cssText = serialized;
      } else {
        const parts = new Array(computedStyle.length);
        for (let index = 0; index < computedStyle.length; index += 1) {
          const property = computedStyle[index];
          parts[index] = `${property}:${computedStyle.getPropertyValue(property)};`;
        }
        clone.style.cssText = parts.join("");
      }
    } catch (_error) {}

    const originalChildren = original.children;
    const clonedChildren = clone.children;
    for (
      let index = 0;
      index < originalChildren.length && index < clonedChildren.length;
      index += 1
    ) {
      inlineAll(originalChildren[index], clonedChildren[index]);
    }
  }

  function extractFontUrl(srcValue) {
    const matches = [
      ...srcValue.matchAll(
        /url\(["']?([^"')]+)["']?\)(?:\s*format\(["']?([^"')]+)["']?\))?/gi,
      ),
    ];
    if (matches.length === 0) return null;
    const woff2 = matches.find((m) => m[2] && m[2].toLowerCase().includes("woff2"));
    if (woff2) return woff2[1];
    const woff = matches.find((m) => m[2] && m[2].toLowerCase().includes("woff"));
    if (woff) return woff[1];
    return matches[0][1];
  }

  // Cache resolved font URL -> data URI across captures. Fonts on a page
  // essentially never change, and a batch run emits multiple captures back to
  // back — without this we'd refetch + re-base64 every time.
  const fontDataUriCache = new Map();
  const SRC_DECLARATION_RE = /src\s*:\s*[^;}]+/i;

  async function fetchAsDataUri(url) {
    if (fontDataUriCache.has(url)) return fontDataUriCache.get(url);
    let dataUri = null;
    try {
      const response = await fetch(url, { mode: "cors", credentials: "omit" });
      if (response.ok) {
        const blob = await response.blob();
        if (blob.size <= MAX_FONT_BYTES) {
          dataUri = await new Promise((resolve) => {
            const reader = new FileReader();
            reader.onloadend = () =>
              resolve(typeof reader.result === "string" ? reader.result : null);
            reader.onerror = () => resolve(null);
            reader.readAsDataURL(blob);
          });
        }
      }
    } catch (_error) {
      dataUri = null;
    }
    fontDataUriCache.set(url, dataUri);
    return dataUri;
  }

  function collectFontFaceRuleTexts() {
    const rules = [];
    for (const sheet of document.styleSheets) {
      let cssRules;
      try {
        cssRules = sheet.cssRules;
      } catch (_error) {
        continue;
      }
      if (!cssRules) continue;
      for (const rule of cssRules) {
        const cssText = rule.cssText || "";
        if (cssText.startsWith("@font-face")) rules.push(cssText);
      }
    }
    return rules;
  }

  async function buildInlinedFontCss() {
    const ruleTexts = collectFontFaceRuleTexts();
    if (ruleTexts.length === 0) return null;

    const resolved = ruleTexts.map((cssText) => {
      if (!SRC_DECLARATION_RE.test(cssText)) return null;
      const srcMatch = cssText.match(/src\s*:\s*([^;}]+)[;}]/i);
      if (!srcMatch) return null;
      const url = extractFontUrl(srcMatch[1]);
      if (!url) return null;
      try {
        return { cssText, url: new URL(url, document.baseURI).href };
      } catch (_error) {
        return null;
      }
    });

    const dataUris = await Promise.all(
      resolved.map((entry) => (entry ? fetchAsDataUri(entry.url) : Promise.resolve(null))),
    );

    const inlined = [];
    let totalBytes = 0;
    for (let index = 0; index < resolved.length; index += 1) {
      const entry = resolved[index];
      const dataUri = dataUris[index];
      if (!entry || !dataUri) continue;
      const approxBytes = dataUri.length * 0.75;
      if (totalBytes + approxBytes > MAX_TOTAL_FONT_BYTES) break;
      totalBytes += approxBytes;
      inlined.push(entry.cssText.replace(SRC_DECLARATION_RE, `src: url("${dataUri}")`));
    }
    return inlined.length > 0 ? inlined.join("\n") : null;
  }

  function stripExternal(clone) {
    const images = clone.querySelectorAll("img");
    for (let index = 0; index < images.length; index += 1) {
      const src = images[index].getAttribute("src");
      if (src && !src.startsWith("data:")) images[index].removeAttribute("src");
    }

    const elements = clone.querySelectorAll("*");
    for (let index = 0; index < elements.length; index += 1) {
      const style = elements[index].style.cssText;
      if (style && style.includes("url(")) {
        elements[index].style.cssText = style.replace(
          /url\(["']?(?!data:)[^)"']*["']?\)/gi,
          "none",
        );
      }
    }
  }

  function emitScroll() {
    scrollRaf = 0;
    if (!scrollForwarding) return;
    postToTrustedTop({
      type: "INLINE_EDIT_SCROLL",
      scrollX: window.scrollX,
      scrollY: window.scrollY,
    });
  }

  window.addEventListener(
    "scroll",
    function () {
      if (!scrollForwarding || scrollRaf) return;
      scrollRaf = requestAnimationFrame(emitScroll);
    },
    { passive: true, capture: true },
  );

  async function handleCaptureRequest(event) {
    const requestId = event.data.requestId;
    const scrollX = window.scrollX;
    const scrollY = window.scrollY;
    const width = window.innerWidth;
    const height = window.innerHeight;

    function postResult(dataUrl) {
      postToTrustedTop({
        type: "INLINE_EDIT_SCREENSHOT_RESULT",
        requestId,
        dataUrl,
        scrollX,
        scrollY,
      });
    }

    try {
      // Wait for any pending web fonts to resolve so both inline metrics and
      // the @font-face inlining below see the same loaded faces.
      if (document.fonts && document.fonts.ready) {
        try {
          await document.fonts.ready;
        } catch (_error) {}
      }

      const clone = document.documentElement.cloneNode(true);
      inlineAll(document.documentElement, clone);

      const removedNodes = clone.querySelectorAll("script,link[rel=\"stylesheet\"],style");
      for (let index = 0; index < removedNodes.length; index += 1) {
        removedNodes[index].remove();
      }

      stripExternal(clone);

      // Re-embed web fonts as data-URI @font-face rules so the SVG rasterizer
      // can resolve them — external font URLs aren't fetched during
      // foreignObject rendering, which would otherwise force a fallback face
      // and change text metrics.
      const inlinedFontCss = await buildInlinedFontCss();
      if (inlinedFontCss) {
        const styleEl = document.createElement("style");
        styleEl.textContent = inlinedFontCss;
        const head = clone.querySelector("head");
        if (head) head.appendChild(styleEl);
        else clone.insertBefore(styleEl, clone.firstChild);
      }

      const html = new XMLSerializer().serializeToString(clone);
      const svg =
        `<svg xmlns="http://www.w3.org/2000/svg" width="${width}" height="${height}">` +
        '<foreignObject width="100%" height="100%">' +
        `<div xmlns="http://www.w3.org/1999/xhtml" style="width:${width}px;height:${height}px;overflow:hidden">` +
        `<div style="position:relative;left:-${scrollX}px;top:-${scrollY}px">` +
        html +
        "</div></div></foreignObject></svg>";
      const svgUrl = `data:image/svg+xml;charset=utf-8,${encodeURIComponent(svg)}`;
      const image = new Image();
      image.onload = function () {
        const canvas = document.createElement("canvas");
        canvas.width = width;
        canvas.height = height;
        canvas.getContext("2d").drawImage(image, 0, 0);
        postResult(canvas.toDataURL("image/png"));
      };
      image.onerror = function () {
        postResult(null);
      };
      image.src = svgUrl;
    } catch (_error) {
      postResult(null);
    }
  }

  window.addEventListener("message", function (event) {
    if (!event.data) return;
    // Only accept messages from the direct parent frame. Blocks sibling /
    // unrelated-window postMessage senders that could otherwise reach us.
    if (event.source !== window.parent) return;

    const trustedParentOrigin = getTrustedParentOrigin(event);
    if (!trustedParentOrigin) return;
    trustedTopOrigin = trustedParentOrigin;

    if (event.data.type === "INLINE_EDIT_SCROLL_START") {
      scrollForwarding = true;
      emitScroll();
      return;
    }

    if (event.data.type === "INLINE_EDIT_SCROLL_STOP") {
      scrollForwarding = false;
      if (scrollRaf) cancelAnimationFrame(scrollRaf);
      scrollRaf = 0;
      return;
    }

    if (event.data.type !== "INLINE_EDIT_CAPTURE_REQUEST") return;

    handleCaptureRequest(event);
  });
})();
