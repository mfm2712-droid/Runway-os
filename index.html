<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/app-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/app-icon.png" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/Geist-Variable.woff2" crossorigin />
    <link rel="canonical" href="https://runway-os-six.vercel.app/" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#090d16" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Runway OS" />
    <meta name="description" content="Runway OS — a friction-free personal finance utility. Daily safe spend, subscription leaks, and emergency runway, all local to your browser." />
    <title>Runway OS</title>

    <!-- Open Graph / Twitter Card — shown when this link is shared. The Open
         Graph spec requires og:image/og:url/twitter:image to be absolute
         URLs (relative paths aren't valid here), so these 3 lines are the
         ONLY hardcoded-host spots in the whole app — everything else
         (manifest.json start_url/scope/shortcuts, all in-app navigation)
         is relative and needs no changes when the domain moves.
         TODO when moving off runway-os-six.vercel.app to a custom domain:
         replace the 3 "https://runway-os-six.vercel.app" occurrences below
         with the new domain. See VITE_PUBLIC_URL in .env.example if you'd
         rather wire this through Vite's %ENV% HTML replacement instead. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Runway OS" />
    <meta property="og:title" content="Runway OS — The friction-free financial operating system" />
    <meta property="og:description" content="One number that matters: your safe daily spending limit. No manual categorization, no linked bank accounts, no subscription you forget to cancel." />
    <meta property="og:image" content="https://runway-os-six.vercel.app/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://runway-os-six.vercel.app/" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Runway OS — The friction-free financial operating system" />
    <meta name="twitter:description" content="One number that matters: your safe daily spending limit — plus an AI copilot for the questions a spreadsheet can't answer." />
    <meta name="twitter:image" content="https://runway-os-six.vercel.app/og-image.png" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
